[project]
name = "psilbhb"
description = "Module for running LBHB experiments using psiexperiment framework"
requires-python = ">=3.11"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
    {name = "Stephen David", email="davids@ohsu.edu"},
]
maintainers = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
    {name = "Stephen David", email="davids@ohsu.edu"},
]
dependencies = [
	"enaml[qt6-pyside]",
    "psiexperiment[ni,zarr]",
    "psiopenephys[psi]",
    "psivideo",
    "pymysql",
    "sqlalchemy",
    "joblib",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
psi-celldb = "psilbhb.app.launcher:main_db"

[project.entry-points."psi.settings"]
# Lets psi-config (and anything else built on psi) see this
# package's settings without importing the package itself.
psilbhb = "psilbhb.config_defaults:DEFAULTS"


[build-system]
requires = ["setuptools>=61.2", "wheel", "setuptools_scm[toml]>=3.4.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/psilbhb/version.py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["psilbhb*"]

[tool.pytest.ini_options]
# Limit collection to tests/. The src/psilbhb/stim/test_*.py files are manual
# scripts that need the rig sound libraries and would fail if collected.
testpaths = ["tests"]
